<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Clean ☘ Naija</title>
    <link rel="icon" href="images/OIP.webp">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(rgba(5, 35, 19, 0.78), rgba(5, 35, 19, 0.78)),
                url("images/green-leaves.jpg") center/cover no-repeat;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(10, 35, 20, 0.9);
            padding: 15px 5%;
        }

        .navbar-brand {
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .navbar-brand:hover {
            color: white;
        }

        .signup-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 45px 15px;
        }

        .signup-card {
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.97);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);
        }

        .signup-icon {
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #e4f5e8;
            color: #198754;
            font-size: 28px;
        }

        .signup-card h1 {
            color: #14532d;
            font-weight: 800;
            font-size: 2rem;
            text-align: center;
        }

        .signup-card .subtitle {
            text-align: center;
            color: #68756c;
            font-size: 14px;
            margin: 10px 0 28px;
        }

        .form-label {
            color: #244b32;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .form-control,
        .form-select {
            min-height: 49px;
            border: 1px solid #d9e5dc;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #198754;
            box-shadow: 0 0 0 3px rgba(25, 135, 84, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-control {
            padding-right: 45px;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #647568;
            cursor: pointer;
        }

        .signup-btn {
            width: 100%;
            padding: 13px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            margin-top: 10px;
            transition: 0.3s;
        }

        .signup-btn:hover {
            background: #11683e;
            transform: translateY(-2px);
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #68756c;
            font-size: 14px;
        }

        .login-text a {
            color: #198754;
            font-weight: 600;
            text-decoration: none;
        }

        .signup-footer {
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 12px;
        }

        .form-check-label {
            font-size: 12px;
            color: #536458;
        }

        .form-check-input:checked {
            background-color: #198754;
            border-color: #198754;
        }

        @media screen and (max-width: 576px) {
            .signup-card {
                padding: 28px 20px;
                border-radius: 18px;
            }

            .signup-card h1 {
                font-size: 1.7rem;
            }

            .navbar-brand {
                font-size: 1.5rem;
            }

            .signup-wrapper {
                padding: 25px 12px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a class="navbar-brand text-decoration-none" href="index.html">
            Clean<span class="bg-success text-white px-2 rounded">
                <i class="fa-solid fa-leaf"></i> NAIJA
            </span>
        </a>
    </nav>

    <main class="signup-wrapper">
        <div class="signup-card">

            <div class="signup-icon">
                <i class="fa-solid fa-user-plus"></i>
            </div>

            <h1>Create Your Account</h1>

            <p class="subtitle">
                Join Clean Naija and help build cleaner, healthier communities.
            </p>

            <form id="signupForm">

                <div class="mb-3">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email address" required>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="phone" placeholder="e.g. 08012345678" required>
                </div>

                <div class="mb-3">
                    <label for="service" class="form-label">What brings you to Clean Naija?</label>
                    <select class="form-select" id="service" required>
                        <option value="" selected disabled>Select an option</option>
                        <option value="public">Report a Dirty Public Place</option>
                        <option value="house">Book Paid House Cleaning</option>
                        <option value="both">Both Services</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-control" id="password" placeholder="Create a password"
                            minlength="8" required>
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <small class="text-muted">Use at least 8 characters.</small>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword"
                        placeholder="Enter your password again" minlength="8" required>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="terms" required>
                    <label class="form-check-label" for="terms">
                        I agree to the terms of service and privacy policy.
                    </label>
                </div>

                <button type="submit" class="signup-btn">
                    Create Account <i class="fa-solid fa-arrow-right ms-2"></i>
                </button>

                <div id="signupMessage" class="mt-3" aria-live="polite"></div>

            </form>

            <p class="login-text">
                Already have an account?
                <a href="login.html">Log In</a>
            </p>

        </div>
    </main>

    <footer class="signup-footer">
        Clean Naija &copy; 2026. Cleaner Streets. Healthier Communities.
    </footer>

    <script>
        const password = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {
            const showPassword = password.type === "password";

            password.type = showPassword ? "text" : "password";

            this.innerHTML = showPassword
                ? '<i class="fa-solid fa-eye-slash"></i>'
                : '<i class="fa-solid fa-eye"></i>';

            this.setAttribute(
                "aria-label",
                showPassword ? "Hide password" : "Show password"
            );
        });

        document.getElementById("signupForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const fullName = document.getElementById("fullName").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const service = document.getElementById("service").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const terms = document.getElementById("terms").checked;
            const message = document.getElementById("signupMessage");

            if (password.value !== confirmPassword) {
                message.innerHTML = '<div class="alert alert-danger">Your passwords do not match.</div>';
                return;
            }

            if (!terms) {
                message.innerHTML = '<div class="alert alert-danger">Please accept the terms to continue.</div>';
                return;
            }

            message.innerHTML =
                '<div class="alert alert-success">Your form is valid, ' +
                fullName.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") +
                '! Account creation is not connected yet. A backend or authentication service is needed to register you securely.</div>';

            console.log({
                fullName,
                email,
                phone,
                service
            });
        });


        document.getElementById("signupForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const terms = document.getElementById("terms").checked;

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            if (!terms) {
                alert("Please accept the terms and conditions.");
                return;
            }

            alert("Thank you for signing up with Clean Naija!");

            window.location.href = "index.html";
        });

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
