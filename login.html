<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Clean ☘ Naija</title>
    <link rel="icon" href="images/OIP.webp">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(rgba(5, 35, 19, 0.78), rgba(5, 35, 19, 0.78)),
                url("images/green-leaves.jpg") center/cover no-repeat;
        }

        .navbar {
            background: rgba(10, 35, 20, 0.9);
            padding: 15px 5%;
        }

        .navbar-brand {
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .navbar-brand:hover {
            color: white;
        }

        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 45px 15px;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 24px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);
        }

        .login-icon {
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #e4f5e8;
            color: #198754;
            font-size: 28px;
        }

        .login-card h1 {
            color: #14532d;
            font-size: 2rem;
            font-weight: 800;
            text-align: center;
        }

        .subtitle {
            color: #68756c;
            font-size: 14px;
            text-align: center;
            margin: 10px 0 28px;
        }

        .form-label {
            color: #244b32;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control {
            min-height: 49px;
            padding: 12px 14px;
            border: 1px solid #d9e5dc;
            border-radius: 10px;
            font-size: 14px;
        }

        .form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 3px rgba(25, 135, 84, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-control {
            padding-right: 45px;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #647568;
            cursor: pointer;
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0 20px;
        }

        .login-options label {
            color: #536458;
            font-size: 12px;
        }

        .login-options a,
        .signup-text a {
            color: #198754;
            font-weight: 600;
            text-decoration: none;
            font-size: 12px;
        }

        .form-check-input:checked {
            background-color: #198754;
            border-color: #198754;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #11683e;
            transform: translateY(-2px);
        }

        .signup-text {
            color: #68756c;
            font-size: 14px;
            text-align: center;
            margin-top: 24px;
        }

        .signup-text a {
            font-size: 14px;
        }

        .login-footer {
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 12px;
        }

        @media screen and (max-width: 576px) {
            .login-card {
                padding: 28px 20px;
                border-radius: 18px;
            }

            .login-card h1 {
                font-size: 1.7rem;
            }

            .navbar-brand {
                font-size: 1.5rem;
            }

            .login-wrapper {
                padding: 25px 12px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a class="navbar-brand text-decoration-none" href="index.html">
            Clean<span class="bg-success text-white px-2 rounded">
                <i class="fa-solid fa-leaf"></i> NAIJA
            </span>
        </a>
    </nav>

    <main class="login-wrapper">
        <div class="login-card">

            <div class="login-icon">
                <i class="fa-solid fa-right-to-bracket"></i>
            </div>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Log in to your Clean Naija account.
            </p>

            <form id="loginForm">

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email address" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>

                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="Enter your password"
                            required>

                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="login-options">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">
                            Remember me
                        </label>
                    </div>

                    <a href="forgot-password.html">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn">
                    Log In <i class="fa-solid fa-arrow-right ms-2"></i>
                </button>

                <div id="loginMessage" class="mt-3" aria-live="polite"></div>

            </form>

            <p class="signup-text">
                Don't have an account?
                <a href="signup.html">Create an account</a>
            </p>

        </div>
    </main>

    <footer class="login-footer">
        Clean Naija &copy; 2026. Cleaner Streets. Healthier Communities.
    </footer>

    <script>
        const password = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {
            const showPassword = password.type === "password";

            password.type = showPassword ? "text" : "password";

            this.innerHTML = showPassword
                ? '<i class="fa-solid fa-eye-slash"></i>'
                : '<i class="fa-solid fa-eye"></i>';

            this.setAttribute(
                "aria-label",
                showPassword ? "Hide password" : "Show password"
            );
        });

        document.getElementById("loginForm").addEventListener("submit", function (event) {
            event.preventDefault();

            document.getElementById("loginMessage").innerHTML =
                '<div class="alert alert-info">Your login form is ready. Connect an authentication service to verify your account.</div>';
        });



document.getElementById("loginForm").addEventListener("submit", function (event) {
    event.preventDefault();

    window.location.href = "index.html";
});

    </script>

</body>

</html>
